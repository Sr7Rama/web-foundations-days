<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes Draft &amp; Theme</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes Draft Editor</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main>
      <form onsubmit="return false;">
        <label for="note-text">Write your note:</label>
        <textarea
          id="note-text"
          placeholder="Type your note here..."
          rows="8"
        ></textarea>
      </form>

      <div class="counter-container">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <button id="clear-btn" type="button">Clear</button>
    </main>
  </body>
</html>
